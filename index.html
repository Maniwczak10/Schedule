<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>52-Week Production Scheduler</title>

<!-- SheetJS for reading Excel files -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --bg-main: #111417;
    --bg-panel: #181d22;
    --border-color: #2b353f;
    --text-primary: #e6ebf0;
    --text-muted: #8b98a5;
    --half-slot-w: 48px;
    --line-h: 88px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .planner-card {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    overflow-x: auto;
    width: 100%;
    max-width: 100vw;
  }

  /* Control Bar */
  .control-bar {
    padding: 10px 16px;
    background: #1f262d;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    position: sticky;
    left: 0;
  }
  .control-group { display: flex; align-items: center; gap: 6px; }

  .version-select-wrap {
    display: flex;
    align-items: center;
    background: #111417;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 8px;
  }
  .version-select-wrap label {
    font-size: 11px;
    font-weight: 700;
    color: #ffb74d;
    margin-right: 6px;
    text-transform: uppercase;
  }
  .select-input, .year-input {
    background: transparent;
    color: #fff;
    border: none;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }
  .select-input option { background: #1f262d; color: #fff; }

  .btn-nav {
    background: #2b353f;
    color: #fff;
    border: 1px solid #3e4c5a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-nav:hover { background: #3e4c5a; }
  .btn-primary { background: #007acc; border-color: #0088e6; }
  .btn-primary:hover { background: #0088e6; }

  .btn-sync-git { background: #2e7d32; border-color: #388e3c; color: #fff; }
  .btn-sync-git:hover { background: #388e3c; }

  /* Zoom Controls */
  .zoom-box {
    display: inline-flex;
    align-items: center;
    background: #111417;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 6px;
    gap: 5px;
  }
  .btn-zoom-step {
    background: #232c35;
    color: #fff;
    border: 1px solid #374452;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-zoom-step:hover { background: #374452; }
  .zoom-val-tag {
    font-size: 11px;
    font-weight: 700;
    color: #64b5f6;
    min-width: 34px;
    text-align: center;
    font-family: monospace;
  }

  /* Git Sync Status */
  .sync-status {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #1a2733;
    color: #64b5f6;
    border: 1px solid #1976d2;
  }
  .sync-status.synced { background: #1e3a24; color: #81c784; border-color: #2e7d32; }
  .sync-status.saving { background: #3d3014; color: #ffd54f; border-color: #ffa000; }
  .sync-status.error  { background: #3e1b1b; color: #e57373; border-color: #c62828; }

  .excel-pill {
    font-size: 11px;
    background: #1e3a24;
    color: #81c784;
    border: 1px solid #2e7d32;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .excel-pill.inactive { background: #2c2518; color: #ffb74d; border-color: #f57c00; }

  /* Grid Table */
  .grid-table {
    display: grid;
    grid-template-columns: 120px repeat(42, var(--half-slot-w));
    background: #151a1e;
    width: max-content;
    min-width: 100%;
  }
  .header-cell {
    border-right: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    text-align: center;
    padding: 4px;
    font-size: 11px;
    background: #1c232a;
    font-weight: 600;
  }
  .status-corner {
    background: #182a3a;
    color: #4fc3f7;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-transform: uppercase;
    position: sticky;
    left: 0;
    z-index: 30;
  }
  .day-header {
    grid-column: span 6;
    font-weight: 700;
    font-size: 12px;
    background: #232c35;
    color: #e2e8f0;
  }
  .day-date {
    display: block;
    font-size: 10px;
    color: #64b5f6;
    margin-top: 2px;
  }
  .shift-header {
    grid-column: span 2;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
  }

  .lane-label {
    background: #1a2026;
    border-right: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: var(--line-h);
    position: sticky;
    left: 0;
    z-index: 25;
  }
  .lane-slots {
    grid-column: span 42;
    display: grid;
    grid-template-columns: repeat(42, var(--half-slot-w));
    position: relative;
    height: var(--line-h);
    border-bottom: 1px solid var(--border-color);
  }
  .grid-slot {
    border-right: 1px dashed rgba(255, 255, 255, 0.04);
    height: 100%;
  }
  .grid-slot.shift-border { border-right: 1px solid rgba(255, 255, 255, 0.12); }
  .grid-slot.day-border { border-right: 1px solid var(--border-color); }

  /* Blocks */
  .schedule-block {
    position: absolute;
    top: 3px;
    bottom: 3px;
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 10.5px;
    line-height: 1.15;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .schedule-block.active-drag {
    z-index: 50 !important;
    opacity: 0.85;
    cursor: grabbing;
    box-shadow: 0 8px 18px rgba(0,0,0,0.85);
    outline: 2px dashed rgba(255, 255, 255, 0.7);
  }

  .block-header { display: flex; justify-content: space-between; align-items: center; }
  .block-lot { font-weight: 800; font-size: 10.5px; }
  .block-actions { display: flex; align-items: center; gap: 4px; }
  .block-btn { font-size: 10px; opacity: 0.7; cursor: pointer; padding: 0 2px; }
  .block-btn:hover { opacity: 1; transform: scale(1.15); }
  .block-name { white-space: normal; word-break: break-word; font-size: 9.5px; font-weight: 600; }
  .block-qty { font-size: 8.5px; opacity: 0.95; }

  .sub-batches-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow-y: auto;
    max-height: 52px;
    font-family: monospace;
    font-size: 9px;
  }
  .sub-batch-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block-footer-notes {
    font-size: 8px;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 1px;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .resize-handle {
    position: absolute;
    top: 0; bottom: 0;
    width: 8px;
    cursor: ew-resize;
    z-index: 5;
  }
  .resize-handle.left { left: 0; }
  .resize-handle.right { right: 0; }

  .key-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 14px;
    width: 100%;
    max-width: 100%;
  }
  .key-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .key-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .key-group-title {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    text-align: center;
    color: #b0bec5;
  }
  .key-item {
    padding: 4px 8px;
    font-size: 10.5px;
    font-weight: 700;
    border: 1px solid rgba(0,0,0,0.2);
    margin-bottom: 2px;
  }

  .c-excenel-ez     { background-color: #808080; color: #000; }
  .c-excede-100     { background-color: #ffc000; color: #000; }
  .c-excede-200     { background-color: #008000; color: #fff; }
  .c-brightstock    { background-color: #ff6600; color: #000; }
  .c-spectramast-lc { background-color: #ff00ff; color: #000; }
  .c-spectramast-dc { background-color: #ff99cc; color: #000; }
  .c-naxcel-4g      { background-color: #00b0f0; color: #000; }
  .c-naxcel-1g      { background-color: #ffff00; color: #000; }
  .c-convenia       { background-color: #7030a0; color: #fff; }
  .c-factrel        { background-color: #1b365d; color: #fff; }
  .c-diluent        { background-color: #368bc1; color: #000; }
  .c-diroban        { background-color: #92d050; color: #000; }
  .c-amiglyde       { background-color: #8a709b; color: #fff; }
  .c-maintenance    { background-color: #ff0000; color: #fff; }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    top:0; left:0; width:100vw; height:100vh;
    background: rgba(0,0,0,0.75);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-box {
    background: #20272f;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 18px;
    width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-box label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .modal-box input, .modal-box select {
    background: #111417;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .modal-box input:disabled {
    background: #1a1e23;
    color: #6c7883;
    border-color: #262c33;
  }

  .batch-header-group { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .btn-sub-add {
    background: #007acc;
    color: #fff;
    border: none;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
  }
  .btn-sub-add:hover { background: #0098ff; }

  .sub-batch-input-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.9fr 24px;
    gap: 6px;
    align-items: center;
    background: #171c21;
    padding: 6px;
    border-radius: 4px;
    border: 1px solid #28333e;
  }
  .btn-del-sub {
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    height: 26px;
    font-weight: 700;
  }

  .two-col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btn-save { background: #2e7d32; color: #fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .btn-copy { background: #007acc; color: #fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .btn-del  { background: #c62828; color: #fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .btn-cancel { background: #546e7a; color: #fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
</style>
</head>

<body>
<div class="planner-card">
  <div class="control-bar">
    <div class="control-group">
      <button class="btn-nav" id="btnPrevWeek" onclick="changeWeek(-1)">&lsaquo; Prev Week</button>
      <select class="select-input" id="weekSelector" onchange="onWeekSelect(this.value)"
        style="font-weight: 700; background: #111417; padding: 5px 8px; border: 1px solid var(--border-color); border-radius: 4px;"></select>
      <button class="btn-nav" id="btnNextWeek" onclick="changeWeek(1)">Next Week &rsaquo;</button>
      <input type="number" id="yearSelector" class="year-input" value="2026" min="2020" max="2035" onchange="onYearChange()"
        style="width: 60px; background: #111417; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; text-align: center;">
    </div>

    <div class="control-group">
      <button class="btn-nav btn-sync-git" onclick="saveToGitHub()" title="Commit schedule directly to GitHub">💾 Save to GitHub</button>
      <button class="btn-nav" onclick="promptTokenSetup()" title="Set GitHub Token on this device">🔑 Set Token</button>
      <span class="sync-status" id="cloudSyncPill">● Checking Cloud...</span>
    </div>

    <div class="control-group">
      <label class="btn-nav" style="cursor: pointer;">
        📂 Link Excel Sheet
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelUpload(event)">
      </label>
      <span class="excel-pill inactive" id="excelStatusPill">No Workbook Linked</span>
    </div>

    <div class="control-group">
      <div class="zoom-box">
        <label style="font-size: 11px; color: var(--text-muted); font-weight: 700;">Zoom:</label>
        <button class="btn-zoom-step" onclick="stepZoom(-1)" title="Step Out 1px">−</button>
        <input type="range" id="zoomSlider" min="28" max="110" value="48" step="1" oninput="onZoomChange(this.value)"
          style="cursor: pointer; width: 68px;">
        <button class="btn-zoom-step" onclick="stepZoom(1)" title="Step In 1px">+</button>
        <span class="zoom-val-tag" id="zoomValDisplay">48px</span>
      </div>
    </div>

    <div class="control-group">
      <div class="version-select-wrap">
        <label>Status:</label>
        <select id="statusSelect" class="select-input" onchange="onStatusChange(this.value)">
          <option value="IN PROCESS">IN PROCESS</option>
          <option value="DRAFT">DRAFT</option>
          <option value="REV A">REV A</option>
          <option value="REV B">REV B</o
